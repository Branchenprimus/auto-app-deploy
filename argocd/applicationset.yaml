apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: single-container-webapps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - git:
        repoURL: https://github.com/Branchenprimus/auto-app-deploy
        revision: main
        files:
          - path: apps/*.yaml
  template:
    metadata:
      name: '{{.name}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/Branchenprimus/auto-app-deploy
        targetRevision: main
        path: chart/single-container-webapp
        helm:
          valueFiles:
            - ../../{{.path.path}}/{{.path.filename}}
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{.namespace}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
