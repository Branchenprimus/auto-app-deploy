name: alarm-app
image:
  repository: ghcr.io/branchenprimus/alarm-app
  pullSecrets:
    - name: ghcr-pull
  tag: v2.0.0
  pullPolicy: IfNotPresent
container:
  port: 8080
route:
  host: alarm-app.darwin-labs.org
  path: /
homepage:
  icon: /icons/alarm.svg
access:
  enabled: true
resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 250m
    memory: 128Mi
env: []
namespace: apps
