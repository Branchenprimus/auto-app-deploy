name: garmin-dashboard
image:
  repository: ghcr.io/branchenprimus/garmin-dashboard
  pullSecrets:
    - name: ghcr-pull
  tag: v0.3.0
  pullPolicy: IfNotPresent
container:
  port: 8000
route:
  host: garmin.darwin-labs.org
  path: /
homepage:
  name: Laufanalyse
  description: Private Auswertung der Garmin-Trainingsdaten
# Health data: keep behind Cloudflare Access.
access:
  enabled: true
resources:
  requests:
    cpu: 25m
    memory: 96Mi
  limits:
    cpu: 500m
    memory: 256Mi
env:
  - name: DATA_SOURCE
    value: garmin
  - name: DATABASE_PATH
    value: /app/data/garmin.sqlite3
  - name: SYNC_INTERVAL_SECONDS
    value: "900"
  - name: GARMIN_PERSONAL_API_KEY_FILE
    value: /secrets/garmin/api-key
# Kubernetes Secret "garmin-dashboard" (namespace apps) with key "api-key";
# created manually, never committed. 0444: the container runs as non-root.
extraSecretMounts:
  - name: garmin-api-key
    secretName: garmin-dashboard
    mountPath: /secrets/garmin/api-key
    subPath: api-key
    defaultMode: 0444
# SQLite on the PVC: keep a single replica.
persistence:
  enabled: true
  mountPath: /app/data
  size: 1Gi
  storageClassName: local-path
namespace: apps
