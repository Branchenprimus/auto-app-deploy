name: usc-crawler
image:
  repository: ghcr.io/branchenprimus/usc-crawler
  pullSecrets:
    - name: ghcr-pull
  tag: v3.0.0
  pullPolicy: IfNotPresent
container:
  port: 8080
route:
  host: usc-crawler.darwin-labs.org
  path: /
homepage:
  description: Urban Sports Club crawler and automation app
  # Temporary Homepage fallback: the app HTML advertises /favicon.svg,
  # but the deployed container currently returns 404 for that asset.
  # See docs/homepage-icon-audit.md for the source-app follow-up.
  icon: /icons/usc-crawler.svg
access:
  enabled: true
resources:
  requests:
    cpu: 75m
    memory: 128Mi
  limits:
    cpu: 750m
    memory: 512Mi
env:
  - name: AUTOMATION_ENABLED
    value: "true"
  - name: DEFAULT_CRAWL_CITY
    value: Köln
  - name: DEFAULT_CRAWL_CONTRACT
    value: m
  - name: DEFAULT_CRAWL_DAYS
    value: "14"
  - name: DAILY_UPDATE_HOUR
    value: "3"
persistence:
  enabled: true
  mountPath: /app/data
  size: 2Gi
namespace: apps
