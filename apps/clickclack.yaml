name: clickclack
image:
  repository: ghcr.io/branchenprimus/clickclack
  pullSecrets:
    - name: ghcr-pull
  # Bumped automatically by .github/workflows/track-clickclack.yaml (PR-gated).
  # Format: <YYYYMMDD>-<upstream-short-sha>
  tag: 20260602-7673eea
  pullPolicy: IfNotPresent
container:
  port: 8080
route:
  host: clickclack.darwin-labs.org
  path: /
homepage:
  description: Team chat and bot collaboration app
  icon: https://clickclack.darwin-labs.org/favicon.svg
  # "/" is ClickClack's marketing landing page; the chat app lives at "/app".
  href: https://clickclack.darwin-labs.org/app
# Gated behind Cloudflare Access (Google IdP) — same perimeter as the other
# protected apps. NOTE: this gates the whole host incl. /api, so the OpenClaw
# bot must reach ClickClack via the in-cluster service URL
# (http://clickclack.apps.svc.cluster.local:8080) with its ccb_ token, not the
# public host.
access:
  enabled: true
  name: ClickClack
  policy_name: ClickClack Google login
  app_launcher_visible: true
  session_duration: 24h
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi
env:
  - name: CLICKCLACK_PUBLIC_URL
    value: https://clickclack.darwin-labs.org
# SQLite DB + uploads live here. ReadWriteOnce + replicaCount 1 (chart default)
# — do NOT scale replicas with the SQLite backend.
persistence:
  enabled: true
  mountPath: /app/data
  size: 5Gi
namespace: apps
