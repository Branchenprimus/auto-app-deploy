name: flashcards
image:
  repository: ghcr.io/branchenprimus/flashcards
  tag: v3.0.0
  pullPolicy: IfNotPresent
container:
  port: 5000
route:
  host: flashcards.darwin-labs.org
  path: /
access:
  enabled: true
resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 250m
    memory: 128Mi
env: []
namespace: apps
