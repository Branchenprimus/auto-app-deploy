name: simple-notes
image:
  repository: ghcr.io/branchenprimus/simple-notes
  pullSecrets:
    - name: ghcr-pull
  tag: v3.0.0
  pullPolicy: IfNotPresent
container:
  port: 8080
route:
  host: simple-notes.darwin-labs.org
  path: /
access:
  enabled: true
resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 250m
    memory: 128Mi
env:
  - name: NOTES_DB_PATH
    value: "/data/simple-notes.sqlite"
persistence:
  enabled: true
  mountPath: /data
  size: 1Gi
  storageClassName: local-path
namespace: apps
