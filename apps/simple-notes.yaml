name: simple-notes
image:
  repository: ghcr.io/branchenprimus/simple-notes
  pullSecrets:
    - name: ghcr-pull
  tag: v1.0.1
  pullPolicy: IfNotPresent
container:
  port: 8080
route:
  host: simple-notes.darwin-labs.org
  path: /
access:
  enabled: true
resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 250m
    memory: 128Mi
env: []
namespace: apps
