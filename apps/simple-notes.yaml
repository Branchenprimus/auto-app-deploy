name: simple-notes
image:
  repository: ghcr.io/branchenprimus/simple-notes
  pullSecrets:
    - name: ghcr-pull
  tag: v2.1.0
  pullPolicy: IfNotPresent
container:
  port: 8080
route:
  host: simple-notes.darwin-labs.org
  path: /
homepage:
  description: Notes app
  icon: https://simple-notes.darwin-labs.org/favicon.ico
access:
  enabled: true
resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 250m
    memory: 128Mi
env: []
namespace: apps
