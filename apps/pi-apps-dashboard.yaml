name: pi-apps-dashboard
image:
  repository: ghcr.io/branchenprimus/pi-apps-dashboard
  pullSecrets:
    - name: ghcr-pull
  tag: v1.0.0
  pullPolicy: IfNotPresent
container:
  port: 8000
route:
  host: pi-apps-dashboard.darwin-labs.org
  path: /
homepage:
  name: Pi Apps Dashboard
  description: Raspberry Pi app dashboard
  icon: https://pi-apps-dashboard.darwin-labs.org/static/icons/dashboard.svg?v=3
access:
  enabled: true
resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 250m
    memory: 128Mi
env: []
namespace: apps
