name: triathlon-race-planner
image:
  repository: ghcr.io/branchenprimus/triathlon-race-planner
  tag: v3.0.0
  pullPolicy: IfNotPresent
container:
  port: 80
route:
  host: triathlon-race-planner.darwin-labs.org
  path: /
access:
  enabled: true
homepage:
  name: Race Planner
  description: Pace und Nutrition für Triathlon, Radrennen, Lauf und Schwimmen
resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 250m
    memory: 128Mi
env: []
namespace: apps
