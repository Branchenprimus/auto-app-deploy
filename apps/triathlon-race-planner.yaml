name: triathlon-race-planner
image:
  repository: ghcr.io/branchenprimus/triathlon-race-planner
  tag: v0.1.1
  pullPolicy: IfNotPresent
container:
  port: 80
route:
  host: triathlon-race-planner.darwin-labs.org
  path: /
access:
  enabled: true
resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 250m
    memory: 128Mi
env: []
namespace: apps
