name: triathlon-race-planner

image:
  repository: ghcr.io/branchenprimus/triathlon-race-planner
  tag: v1.0.2
  pullPolicy: IfNotPresent

container:
  port: 80

route:
  host: triathlon-race-planner.darwin-labs.org
  path: /
homepage:
  description: Race planning app
  # Derived from the app's browser tab icon at /favicon.svg and mirrored into
  # Homepage so Cloudflare Access does not block image loading.
  icon: /icons/triathlon-race-planner-favicon.svg

access:
  enabled: true

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 250m
    memory: 128Mi

env: []

namespace: apps
