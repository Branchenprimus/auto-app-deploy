name: codex-dashboard-api
image:
  repository: ghcr.io/branchenprimus/codex-dashboard-api
  pullSecrets:
    - name: ghcr-pull
  tag: v2.0.0
  pullPolicy: IfNotPresent
container:
  port: 8080
route:
  host: codex-dashboard-api.darwin-labs.org
  path: /
access:
  enabled: true
resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 250m
    memory: 128Mi
env:
  - name: CODEX_USAGE_SOURCE
    value: "chatgpt-oauth"
  - name: CODEX_AUTH_JSON
    value: "/secrets/codex-auth/auth.json"
  - name: CODEX_WIDGET_TOKEN
    valueFrom:
      secretKeyRef:
        name: codex-dashboard-api
        key: CODEX_WIDGET_TOKEN
  - name: CODEX_USAGE_CACHE_SECONDS
    value: "900"
extraSecretMounts:
  - name: codex-auth-json
    secretName: codex-auth
    mountPath: /secrets/codex-auth/auth.json
    subPath: auth.json
    defaultMode: 0400
namespace: apps
