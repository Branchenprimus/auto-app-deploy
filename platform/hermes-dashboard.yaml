apiVersion: v1
kind: Service
metadata:
  name: hermes-dashboard
  namespace: apps
  labels:
    app.kubernetes.io/name: hermes-dashboard
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 9119
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: hermes-dashboard
  namespace: apps
  labels:
    app.kubernetes.io/name: hermes-dashboard
    kubernetes.io/service-name: hermes-dashboard
addressType: IPv4
ports:
  - name: http
    port: 9119
    protocol: TCP
endpoints:
  - addresses:
      - 192.168.178.38
    conditions:
      ready: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hermes-dashboard
  namespace: apps
  labels:
    app.kubernetes.io/name: hermes-dashboard
spec:
  rules:
    - host: hermes.darwin-labs.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hermes-dashboard
                port:
                  name: http
