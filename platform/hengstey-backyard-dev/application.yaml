apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hengstey-backyard-dev
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: git@github.com:Branchenprimus/hengstey-backyard-platform.git
      targetRevision: f72ee9ac9543d6b407d320ed1e26ce105307e9ab
      path: deploy/helm/hengstey-backyard
      helm:
        releaseName: hengstey-backyard
        valueFiles:
          - $values/platform/hengstey-backyard-dev/values.yaml
    - repoURL: https://github.com/Branchenprimus/auto-app-deploy
      targetRevision: main
      ref: values
      path: platform/hengstey-backyard-dev
      directory:
        include: application.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: hengstey-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
