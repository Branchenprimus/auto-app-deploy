apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hengstey-backyard-dev
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: git@github.com:Branchenprimus/hengstey-backyard-platform.git
      targetRevision: e7e477ca3202f99083b735724f30c3c2284c3559
      path: deploy/helm/hengstey-backyard
      helm:
        releaseName: hengstey-backyard
        valueFiles:
          - $values/platform/hengstey-backyard-dev/values.yaml
    - repoURL: https://github.com/Branchenprimus/auto-app-deploy
      targetRevision: main
      ref: values
      path: platform/hengstey-backyard-dev
      directory:
        include: '{application.yaml,adminer.yaml}'
  destination:
    server: https://kubernetes.default.svc
    namespace: hengstey-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
