      <rect width="64" height="64" rx="14" fill="#111827"/>
      <circle cx="29" cy="29" r="15" fill="none" stroke="#22c55e" stroke-width="6"/>
      <path d="M40 40l10 10" stroke="#22c55e" stroke-width="7" stroke-linecap="round"/>
