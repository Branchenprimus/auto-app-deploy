apiVersion: v1
kind: ServiceAccount
metadata:
  name: homepage
  namespace: apps
  labels:
    app.kubernetes.io/name: homepage
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  namespace: apps
  labels:
    app.kubernetes.io/name: homepage
data:
  kubernetes.yaml: |
    mode: cluster
    ingress: true
  settings.yaml: |
    title: Darwin Labs
    theme: dark
    color: violet
    cardBlur: sm
    target: _blank
    hideVersion: true
    hideErrors: true
    statusStyle: dot
    layout:
      Apps:
        style: row
        columns: 3
      Platform:
        style: row
        columns: 3
      Deployment:
        style: row
        columns: 3
      Monitoring:
        style: row
        columns: 3
  bookmarks.yaml: |
    - Developer:
        - GitHub:
            - abbr: GH
              href: https://github.com/Branchenprimus
        - Auto App Deploy:
            - abbr: GIT
              href: https://github.com/Branchenprimus/auto-app-deploy
  services.yaml: |
    - Platform:
        - ArgoCD:
            href: https://argocd.darwin-labs.org
            siteMonitor: https://argocd.darwin-labs.org
            description: GitOps deployment control plane
            icon: https://cdn.simpleicons.org/argo/EF7B4D
        - Homepage:
            href: https://homepage.darwin-labs.org
            siteMonitor: https://homepage.darwin-labs.org
            description: Server start page and service index
            icon: homepage.png
    - Deployment:
        - GitOps Repository:
            href: https://github.com/Branchenprimus/auto-app-deploy
            siteMonitor: https://github.com/Branchenprimus/auto-app-deploy
            description: App manifests, Helm chart, platform config
            icon: github.png
        - Issue Pipeline Repository:
            href: https://github.com/Branchenprimus/gh-issue-pipeline
            siteMonitor: https://github.com/Branchenprimus/gh-issue-pipeline
            description: GitHub issue automation service
            icon: github.png
        - GitHub Actions:
            href: https://github.com/Branchenprimus/auto-app-deploy/actions
            siteMonitor: https://github.com/Branchenprimus/auto-app-deploy/actions
            description: Cloudflare Access and platform workflows
            icon: https://cdn.simpleicons.org/githubactions/2088FF
        - GHCR Packages:
            href: https://github.com/orgs/Branchenprimus/packages
            siteMonitor: https://github.com/orgs/Branchenprimus/packages
            description: Container images
            icon: docker.png
    - Monitoring:
        - Grafana:
            href: https://grafana.darwin-labs.org
            description: Planned metrics and log dashboard
            icon: grafana.png
        - Loki:
            href: https://grafana.darwin-labs.org/explore
            description: Planned log exploration
            icon: loki.png
        - Cloudflare Zero Trust:
            href: https://dash.cloudflare.com/79adc4436321f0f308e68f5529f190bc/one/overview/dashboard?duration=24h
            siteMonitor: https://dash.cloudflare.com/79adc4436321f0f308e68f5529f190bc/one/overview/dashboard?duration=24h
            description: Access policies and tunnel status
            icon: cloudflare.png
  widgets.yaml: |
    - search:
        provider: duckduckgo
        target: _blank
  docker.yaml: ""
  proxmox.yaml: ""
  openapi.yaml: ""
  custom.css: |
    html,
    body,
    #__next {
      min-height: 100%;
      background:
        radial-gradient(circle at 14% 8%, rgba(14, 165, 233, 0.20), transparent 30rem),
        radial-gradient(circle at 90% 18%, rgba(139, 92, 246, 0.26), transparent 28rem),
        linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%) !important;
      background-attachment: fixed !important;
    }

    main,
    [class*="layout"] {
      background: transparent !important;
    }

    .service-card,
    a.service-card,
    [class*="service-card"] {
      border: 1px solid rgba(196, 181, 253, 0.18) !important;
      background: rgba(15, 23, 42, 0.62) !important;
      box-shadow: 0 18px 45px rgba(15, 23, 42, 0.28) !important;
      transition: transform 0.15s ease, box-shadow 0.15s ease !important;
      backdrop-filter: blur(12px);
    }

    .service-card:hover,
    a.service-card:hover,
    [class*="service-card"]:hover {
      transform: translateY(-3px) !important;
      box-shadow: 0 24px 60px rgba(139, 92, 246, 0.28) !important;
    }

    .repo-link-button {
      position: absolute;
      right: 0.75rem;
      bottom: 0.75rem;
      z-index: 20;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 1.75rem;
      padding: 0.25rem 0.55rem;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 0.375rem;
      background: rgba(15, 23, 42, 0.72);
      color: rgb(226, 232, 240);
      font-size: 0.7rem;
      font-weight: 700;
      line-height: 1;
      text-decoration: none;
      backdrop-filter: blur(10px);
    }

    .repo-link-button:hover {
      background: rgba(79, 70, 229, 0.78);
      color: white;
    }

    .service-card:has(.repo-link-button) .service-title {
      padding-bottom: 1.9rem;
    }

    #information-widgets h2,
    .services-group h2,
    [class*="services"] h2 {
      letter-spacing: 0.08em;
      text-shadow: 0 0 24px rgba(139, 92, 246, 0.5);
    }
  custom.js: |
    (() => {
      const reposByHost = {
        "clickclack.darwin-labs.org": "https://github.com/Branchenprimus/clickclack",
        "flashcards.darwin-labs.org": "https://github.com/Branchenprimus/flashcards",
        "gh-issue-pipeline.darwin-labs.org": "https://github.com/Branchenprimus/gh-issue-pipeline",
        "simple-notes.darwin-labs.org": "https://github.com/Branchenprimus/simple-notes",
        "training-planner.darwin-labs.org": "https://github.com/Branchenprimus/training-planner",
        "triathlon-race-planner.darwin-labs.org": "https://github.com/Branchenprimus/triathlon-race-planner",
        "usc-crawler.darwin-labs.org": "https://github.com/Branchenprimus/usc-crawler"
      };

      const appHostFromCard = (card) => {
        const anchors = [...card.querySelectorAll("a[href]")];
        const appAnchor = anchors.find((anchor) => {
          try {
            return new URL(anchor.href).hostname.endsWith(".darwin-labs.org");
          } catch {
            return false;
          }
        });

        if (!appAnchor) return "";
        return new URL(appAnchor.href).hostname;
      };

      const addRepoButtons = () => {
        document.querySelectorAll(".service-card").forEach((card) => {
          if (card.querySelector(".repo-link-button")) return;

          const repoUrl = reposByHost[appHostFromCard(card)];
          if (!repoUrl) return;

          const button = document.createElement("a");
          button.className = "repo-link-button";
          button.href = repoUrl;
          button.target = "_blank";
          button.rel = "noreferrer";
          button.textContent = "GitHub";
          button.setAttribute("aria-label", "Open GitHub repository");
          button.addEventListener("click", (event) => event.stopPropagation());

          card.appendChild(button);
        });
      };

      addRepoButtons();
      new MutationObserver(addRepoButtons).observe(document.body, {
        childList: true,
        subtree: true
      });
    })();
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: homepage
  labels:
    app.kubernetes.io/name: homepage
rules:
  - apiGroups:
      - ""
    resources:
      - namespaces
      - nodes
      - pods
    verbs:
      - get
      - list
  - apiGroups:
      - networking.k8s.io
    resources:
      - ingresses
    verbs:
      - get
      - list
  - apiGroups:
      - metrics.k8s.io
    resources:
      - nodes
      - pods
    verbs:
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: homepage
  labels:
    app.kubernetes.io/name: homepage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: homepage
subjects:
  - kind: ServiceAccount
    name: homepage
    namespace: apps
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: apps
  labels:
    app.kubernetes.io/name: homepage
spec:
  revisionHistoryLimit: 3
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: homepage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: homepage
    spec:
      serviceAccountName: homepage
      automountServiceAccountToken: true
      containers:
        - name: homepage
          image: ghcr.io/gethomepage/homepage:latest
          imagePullPolicy: Always
          env:
            - name: MY_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: "$(MY_POD_IP):3000,homepage.darwin-labs.org"
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /api/healthcheck
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/healthcheck
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - mountPath: /app/config
              name: homepage-config
            - mountPath: /app/config/logs
              name: logs
      volumes:
        - name: homepage-config
          configMap:
            name: homepage
        - name: logs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: homepage
  namespace: apps
  labels:
    app.kubernetes.io/name: homepage
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: homepage
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homepage
  namespace: apps
  labels:
    app.kubernetes.io/name: homepage
spec:
  rules:
    - host: homepage.darwin-labs.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: homepage
                port:
                  name: http
