apiVersion: v1
kind: ServiceAccount
metadata:
  name: homepage
  namespace: apps
  labels:
    app.kubernetes.io/name: homepage
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  namespace: apps
  labels:
    app.kubernetes.io/name: homepage
data:
  kubernetes.yaml: |
    mode: cluster
    ingress: true
  settings.yaml: |
    title: Darwin Labs
    theme: dark
    color: violet
    cardBlur: sm
    target: _blank
    hideVersion: true
    hideErrors: true
    statusStyle: dot
    layout:
      Apps:
        style: row
        columns: 3
      Platform:
        style: row
        columns: 3
      Deployment:
        style: row
        columns: 3
      Monitoring:
        style: row
        columns: 3
  bookmarks.yaml: |
    - Developer:
        - GitHub:
            - abbr: GH
              href: https://github.com/Branchenprimus
        - Auto App Deploy:
            - abbr: GIT
              href: https://github.com/Branchenprimus/auto-app-deploy
  services.yaml: |
    - Platform:
        - ArgoCD:
            href: https://argocd.darwin-labs.org
            siteMonitor: https://argocd.darwin-labs.org
            description: GitOps deployment control plane
            icon: argocd.png
        - Homepage:
            href: https://homepage.darwin-labs.org
            siteMonitor: https://homepage.darwin-labs.org
            description: Server start page and service index
            icon: homepage.png
    - Deployment:
        - GitOps Repository:
            href: https://github.com/Branchenprimus/auto-app-deploy
            siteMonitor: https://github.com/Branchenprimus/auto-app-deploy
            description: App manifests, Helm chart, platform config
            icon: github.png
        - Issue Pipeline Repository:
            href: https://github.com/Branchenprimus/gh-issue-pipeline
            siteMonitor: https://github.com/Branchenprimus/gh-issue-pipeline
            description: GitHub issue automation service
            icon: github.png
        - GitHub Actions:
            href: https://github.com/Branchenprimus/auto-app-deploy/actions
            siteMonitor: https://github.com/Branchenprimus/auto-app-deploy/actions
            description: Cloudflare Access and platform workflows
            icon: github-actions.png
        - GHCR Packages:
            href: https://github.com/orgs/Branchenprimus/packages
            siteMonitor: https://github.com/orgs/Branchenprimus/packages
            description: Container images
            icon: docker.png
    - Monitoring:
        - Grafana:
            href: https://grafana.darwin-labs.org
            description: Planned metrics and log dashboard
            icon: grafana.png
        - Loki:
            href: https://grafana.darwin-labs.org/explore
            description: Planned log exploration
            icon: loki.png
        - Cloudflare Zero Trust:
            href: https://one.dash.cloudflare.com
            siteMonitor: https://one.dash.cloudflare.com
            description: Access policies and tunnel status
            icon: cloudflare.png
  widgets.yaml: |
    - search:
        provider: duckduckgo
        target: _blank
  docker.yaml: ""
  proxmox.yaml: ""
  openapi.yaml: ""
  custom.css: |
    html,
    body,
    #__next {
      min-height: 100%;
      background:
        radial-gradient(circle at 14% 8%, rgba(14, 165, 233, 0.20), transparent 30rem),
        radial-gradient(circle at 90% 18%, rgba(139, 92, 246, 0.26), transparent 28rem),
        linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%) !important;
      background-attachment: fixed !important;
    }

    main,
    [class*="layout"] {
      background: transparent !important;
    }

    .service-card,
    a.service-card,
    [class*="service-card"] {
      border: 1px solid rgba(196, 181, 253, 0.18) !important;
      background: rgba(15, 23, 42, 0.62) !important;
      box-shadow: 0 18px 45px rgba(15, 23, 42, 0.28) !important;
      transition: transform 0.15s ease, box-shadow 0.15s ease !important;
      backdrop-filter: blur(12px);
    }

    .service-card:hover,
    a.service-card:hover,
    [class*="service-card"]:hover {
      transform: translateY(-3px) !important;
      box-shadow: 0 24px 60px rgba(139, 92, 246, 0.28) !important;
    }

    #information-widgets h2,
    .services-group h2,
    [class*="services"] h2 {
      letter-spacing: 0.08em;
      text-shadow: 0 0 24px rgba(139, 92, 246, 0.5);
    }
  custom.js: ""
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: homepage
  labels:
    app.kubernetes.io/name: homepage
rules:
  - apiGroups:
      - ""
    resources:
      - namespaces
      - nodes
      - pods
    verbs:
      - get
      - list
  - apiGroups:
      - networking.k8s.io
    resources:
      - ingresses
    verbs:
      - get
      - list
  - apiGroups:
      - metrics.k8s.io
    resources:
      - nodes
      - pods
    verbs:
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: homepage
  labels:
    app.kubernetes.io/name: homepage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: homepage
subjects:
  - kind: ServiceAccount
    name: homepage
    namespace: apps
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: apps
  labels:
    app.kubernetes.io/name: homepage
spec:
  revisionHistoryLimit: 3
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: homepage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: homepage
    spec:
      serviceAccountName: homepage
      automountServiceAccountToken: true
      containers:
        - name: homepage
          image: ghcr.io/gethomepage/homepage:latest
          imagePullPolicy: Always
          env:
            - name: MY_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: "$(MY_POD_IP):3000,homepage.darwin-labs.org"
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /api/healthcheck
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/healthcheck
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - mountPath: /app/config
              name: homepage-config
            - mountPath: /app/config/logs
              name: logs
      volumes:
        - name: homepage-config
          configMap:
            name: homepage
        - name: logs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: homepage
  namespace: apps
  labels:
    app.kubernetes.io/name: homepage
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: homepage
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homepage
  namespace: apps
  labels:
    app.kubernetes.io/name: homepage
spec:
  rules:
    - host: homepage.darwin-labs.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: homepage
                port:
                  name: http
