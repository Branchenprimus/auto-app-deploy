apiVersion: v1
kind: ServiceAccount
metadata:
  name: homepage
  namespace: apps
  labels:
    app.kubernetes.io/name: homepage
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  namespace: apps
  labels:
    app.kubernetes.io/name: homepage
data:
  kubernetes.yaml: |
    mode: cluster
    ingress: true
  settings.yaml: |
    title: Darwin Labs
    theme: dark
    color: violet
    cardBlur: sm
    target: _blank
    hideVersion: true
    hideErrors: true
    statusStyle: dot
    layout:
      Apps:
        style: row
        columns: 3
      Hengstey Backyard Ultra:
        style: row
        columns: 3
      Platform:
        style: row
        columns: 3
      Deployment:
        style: row
        columns: 3
      Repositories:
        style: row
        columns: 3
      Monitoring:
        style: row
        columns: 3
  bookmarks.yaml: |
    - Developer:
        - GitHub Org:
            - abbr: GH
              href: https://github.com/Branchenprimus
        - Auto App Deploy:
            - abbr: GIT
              href: https://github.com/Branchenprimus/auto-app-deploy
        - GitHub Actions:
            - abbr: CI
              href: https://github.com/Branchenprimus/auto-app-deploy/actions
        - GHCR Packages:
            - abbr: IMG
              href: https://github.com/orgs/Branchenprimus/packages
    - Operations:
        - ArgoCD:
            - abbr: CD
              href: https://argocd.darwin-labs.org
        - Grafana Explore:
            - abbr: LOG
              href: https://grafana.darwin-labs.org/explore
        - Cloudflare Access:
            - abbr: CF
              href: https://dash.cloudflare.com/79adc4436321f0f308e68f5529f190bc/one/overview/dashboard?duration=24h
  services.yaml: |
    - Hengstey Backyard Ultra:
        - Website DEV:
            href: https://hengstey-backyard-dev.darwin-labs.org
            description: Entwicklungsumgebung · Anmeldung und Teilnehmerbereich
            icon: /icons/app-default.png
            namespace: hengstey-dev
            app: hengstey-backyard
        - Website PROD:
            href: https://hengstey-backyard-ultra.darwin-labs.org
            description: Produktionswebsite · bestehende Umgebung
            icon: /icons/app-default.png
        - Admin DEV:
            href: https://hengstey-backyard-admin-dev.darwin-labs.org/admin
            description: Teilnehmerverwaltung · eigene Domain mit Cloudflare Access
            icon: /icons/app-default.png
        - Admin PROD:
            href: https://hengstey-backyard-ultra.darwin-labs.org/admin
            description: Produktionsverwaltung · bisheriger Pfad, eigene Domain noch ausstehend
            icon: /icons/app-default.png
        - Adminer DEV:
            href: http://127.0.0.1:18081
            description: Private Datenbank-UI · zuerst dev-action-scripts/dev-db-ui.sh starten
            icon: /icons/app-default.png
            namespace: hengstey-dev
            app: hengstey-backyard-adminer
        - Deployment DEV:
            href: https://argocd.darwin-labs.org/applications/argocd/hengstey-backyard-dev
            description: Argo CD · Rollout und Ressourcen der Entwicklungsumgebung
            icon: /icons/argocd.png
        - Quellcode:
            href: https://github.com/Branchenprimus/hengstey-backyard-platform
            description: Anwendung, Dokumentation und lokale Werkzeuge
            icon: /icons/github.png
        - Container Builds:
            href: https://github.com/Branchenprimus/hengstey-backyard-platform/actions
            description: CI und Container-Builds
            icon: /icons/github-actions.png
        - GitOps DEV:
            href: https://github.com/Branchenprimus/auto-app-deploy/tree/main/platform/hengstey-backyard-dev
            description: Release-Version und Konfiguration der Entwicklungsumgebung
            icon: /icons/github.png
    - Platform:
        - ArgoCD:
            href: https://argocd.darwin-labs.org
            siteMonitor: https://argocd.darwin-labs.org
            description: GitOps deployment control plane
            icon: /icons/argocd.png
        - Homepage:
            href: https://homepage.darwin-labs.org
            siteMonitor: https://homepage.darwin-labs.org
            description: Server start page, service index and live cluster overview
            icon: /icons/homepage.png
            namespace: apps
            app: homepage
        - Hermes Dashboard:
            href: https://hermes.darwin-labs.org
            siteMonitor: https://hermes.darwin-labs.org/api/status
            description: Hermes Agent web UI and management console
            icon: /icons/hermes-dashboard.png
        - Jupyter Lab:
            href: https://jupyter.darwin-labs.org
            siteMonitor: https://jupyter.darwin-labs.org/lab
            description: Protected notebooks workspace on the Pi
            icon: /icons/jupyter-lab.png
    - Deployment:
        - GitOps Repository:
            href: https://github.com/Branchenprimus/auto-app-deploy
            siteMonitor: https://github.com/Branchenprimus/auto-app-deploy
            description: App manifests, Helm chart, platform config
            icon: /icons/github.png
        - Issue Pipeline Repository:
            href: https://github.com/Branchenprimus/gh-issue-pipeline
            siteMonitor: https://github.com/Branchenprimus/gh-issue-pipeline
            description: GitHub issue automation service
            icon: /icons/github.png
        - GitHub Actions:
            href: https://github.com/Branchenprimus/auto-app-deploy/actions
            siteMonitor: https://github.com/Branchenprimus/auto-app-deploy/actions
            description: Cloudflare Access and platform workflows
            icon: /icons/github-actions.png
        - GHCR Packages:
            href: https://github.com/orgs/Branchenprimus/packages
            siteMonitor: https://github.com/orgs/Branchenprimus/packages
            description: Container images
            icon: /icons/ghcr-docker.png
    # BEGIN GENERATED REPOSITORIES
    - Repositories:
        - Flashcards:
            href: https://github.com/branchenprimus/flashcards
            siteMonitor: https://github.com/branchenprimus/flashcards
            description: Source repository for flashcards
            icon: /icons/github.png
        - GH Issue Pipeline:
            href: https://github.com/branchenprimus/gh-issue-pipeline
            siteMonitor: https://github.com/branchenprimus/gh-issue-pipeline
            description: Source repository for gh-issue-pipeline
            icon: /icons/github.png
        - Simple Notes:
            href: https://github.com/branchenprimus/simple-notes
            siteMonitor: https://github.com/branchenprimus/simple-notes
            description: Source repository for simple-notes
            icon: /icons/github.png
        - Training Planner:
            href: https://github.com/branchenprimus/training-planner
            siteMonitor: https://github.com/branchenprimus/training-planner
            description: Source repository for training-planner
            icon: /icons/github.png
        - Triathlon Race Planner:
            href: https://github.com/branchenprimus/triathlon-race-planner
            siteMonitor: https://github.com/branchenprimus/triathlon-race-planner
            description: Source repository for triathlon-race-planner
            icon: /icons/github.png
        - USC Crawler:
            href: https://github.com/branchenprimus/usc-crawler
            siteMonitor: https://github.com/branchenprimus/usc-crawler
            description: Source repository for usc-crawler
            icon: /icons/github.png
    # END GENERATED REPOSITORIES
    - Monitoring:
        - Grafana:
            href: https://grafana.darwin-labs.org
            description: Planned metrics and log dashboard
            icon: /icons/grafana.png
        - Loki:
            href: https://grafana.darwin-labs.org/explore
            description: Planned log exploration
            icon: /icons/loki.png
        - Cloudflare Zero Trust:
            href: https://dash.cloudflare.com/79adc4436321f0f308e68f5529f190bc/one/overview/dashboard?duration=24h
            siteMonitor: https://dash.cloudflare.com/79adc4436321f0f308e68f5529f190bc/one/overview/dashboard?duration=24h
            description: Access policies and tunnel status
            icon: /icons/cloudflare.png
  widgets.yaml: |
    - datetime:
        text_size: xl
        locale: de-DE
        format:
          dateStyle: medium
          timeStyle: short
          hourCycle: h23
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: k3s cluster
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    - search:
        provider: duckduckgo
        target: _blank
  docker.yaml: ""
  proxmox.yaml: ""
  openapi.yaml: ""
  custom.css: |
    html,
    body,
    #__next {
      min-height: 100%;
      background:
        radial-gradient(circle at 14% 8%, rgba(14, 165, 233, 0.20), transparent 30rem),
        radial-gradient(circle at 90% 18%, rgba(139, 92, 246, 0.26), transparent 28rem),
        linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%) !important;
      background-attachment: fixed !important;
    }

    main,
    [class*="layout"] {
      background: transparent !important;
    }

    .service-card,
    a.service-card,
    [class*="service-card"] {
      border: 1px solid rgba(196, 181, 253, 0.18) !important;
      background: rgba(15, 23, 42, 0.62) !important;
      box-shadow: 0 18px 45px rgba(15, 23, 42, 0.28) !important;
      transition: transform 0.15s ease, box-shadow 0.15s ease !important;
      backdrop-filter: blur(12px);
    }

    .service-card:hover,
    a.service-card:hover,
    [class*="service-card"]:hover {
      transform: translateY(-3px) !important;
      box-shadow: 0 24px 60px rgba(139, 92, 246, 0.28) !important;
    }

    #information-widgets h2,
    .services-group h2,
    [class*="services"] h2 {
      letter-spacing: 0.08em;
      text-shadow: 0 0 24px rgba(139, 92, 246, 0.5);
    }

    #information-widgets,
    [class*="information"],
    [class*="widget"] {
      color: rgba(248, 250, 252, 0.96) !important;
    }

    #information-widgets > div,
    [class*="information-widget"],
    [class*="widget-container"] {
      border-color: rgba(196, 181, 253, 0.16) !important;
      background: rgba(15, 23, 42, 0.54) !important;
      backdrop-filter: blur(12px);
    }

    .bookmark,
    a.bookmark,
    [class*="bookmark"] {
      border: 1px solid rgba(125, 211, 252, 0.14) !important;
      background: rgba(15, 23, 42, 0.44) !important;
      border-radius: 14px !important;
    }

    @media (max-width: 760px) {
      body {
        font-size: 14px;
      }

      .service-card,
      a.service-card,
      [class*="service-card"] {
        transform: none !important;
        box-shadow: 0 10px 28px rgba(15, 23, 42, 0.24) !important;
      }

      .service-card:hover,
      a.service-card:hover,
      [class*="service-card"]:hover {
        transform: none !important;
      }

      #information-widgets,
      [class*="information"] {
        gap: 0.5rem !important;
      }

      .services-group,
      [class*="services-group"] {
        margin-bottom: 1rem !important;
      }
    }
  custom.js: ""
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-icons
  namespace: apps
  labels:
    app.kubernetes.io/name: homepage
binaryData:
  alarm-app.png: 
  app-default.png: 
  argocd.png: 
  beszel.png: 
  claude-business-automation.png: 
  cloudflare.png: 
  codex-dashboard-api.png: 
  flashcards.png: 
  flatswipe.png: 
  gh-issue-pipeline.png: 
  ghcr-docker.png: 
  github-actions.png: 
  github.png: 
  glances.png: 
  grafana.png: 
  hermes-dashboard.png: 
  homarr.png: 
  homepage.png: 
  jupyter-lab.png: 
  loki.png: 
  nextcloud.png: 
  simple-notes.png: 
  training-planner.png: 
  triathlon-race-planner.png: 
  uptime-kuma.png: 
  usc-crawler.png: 
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: homepage
  labels:
    app.kubernetes.io/name: homepage
rules:
  - apiGroups:
      - ""
    resources:
      - namespaces
      - nodes
      - pods
    verbs:
      - get
      - list
  - apiGroups:
      - networking.k8s.io
    resources:
      - ingresses
    verbs:
      - get
      - list
  - apiGroups:
      - metrics.k8s.io
    resources:
      - nodes
      - pods
    verbs:
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: homepage
  labels:
    app.kubernetes.io/name: homepage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: homepage
subjects:
  - kind: ServiceAccount
    name: homepage
    namespace: apps
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: apps
  labels:
    app.kubernetes.io/name: homepage
spec:
  revisionHistoryLimit: 3
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: homepage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: homepage
    spec:
      serviceAccountName: homepage
      automountServiceAccountToken: true
      containers:
        - name: homepage
          image: ghcr.io/gethomepage/homepage:latest
          imagePullPolicy: Always
          env:
            - name: MY_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: "$(MY_POD_IP):3000,homepage.darwin-labs.org"
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /api/healthcheck
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/healthcheck
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - mountPath: /app/config
              name: homepage-config
            - mountPath: /app/public/icons
              name: homepage-icons
              readOnly: true
            - mountPath: /app/config/logs
              name: logs
      volumes:
        - name: homepage-config
          configMap:
            name: homepage
        - name: homepage-icons
          configMap:
            name: homepage-icons
        - name: logs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: homepage
  namespace: apps
  labels:
    app.kubernetes.io/name: homepage
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: homepage
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homepage
  namespace: apps
  labels:
    app.kubernetes.io/name: homepage
spec:
  rules:
    - host: homepage.darwin-labs.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: homepage
                port:
                  name: http
