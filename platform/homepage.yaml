apiVersion: v1
kind: ServiceAccount
metadata:
  name: homepage
  namespace: apps
  labels:
    app.kubernetes.io/name: homepage
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  namespace: apps
  labels:
    app.kubernetes.io/name: homepage
data:
  kubernetes.yaml: |
    mode: cluster
  settings.yaml: |
    title: Darwin Labs
    target: _blank
    hideVersion: true
    hideErrors: true
    statusStyle: dot
    layout:
      Apps:
        style: row
        columns: 3
      Platform:
        style: row
        columns: 3
      Deployment:
        style: row
        columns: 3
      Monitoring:
        style: row
        columns: 3
  bookmarks.yaml: |
    - Developer:
        - GitHub:
            - abbr: GH
              href: https://github.com/Branchenprimus
        - Auto App Deploy:
            - abbr: GIT
              href: https://github.com/Branchenprimus/auto-app-deploy
  services.yaml: |
    - Apps:
        - Flashcards:
            href: https://flashcards.darwin-labs.org
            siteMonitor: https://flashcards.darwin-labs.org
            description: Flashcard learning app
            icon: mdi-cards
        - Simple Notes:
            href: https://simple-notes.darwin-labs.org
            siteMonitor: https://simple-notes.darwin-labs.org
            description: Notes app
            icon: mdi-note-text
        - Triathlon Race Planner:
            href: https://triathlon-race-planner.darwin-labs.org
            siteMonitor: https://triathlon-race-planner.darwin-labs.org
            description: Race planning app
            icon: mdi-run
        - USC Crawler:
            href: https://usc-crawler.darwin-labs.org
            siteMonitor: https://usc-crawler.darwin-labs.org
            description: USC search and crawl app
            icon: mdi-web
        - Pi Apps Dashboard:
            href: https://pi-apps-dashboard.darwin-labs.org
            siteMonitor: https://pi-apps-dashboard.darwin-labs.org
            description: Raspberry Pi app dashboard
            icon: mdi-view-dashboard
        - Training Planner:
            href: https://training-planner.darwin-labs.org
            siteMonitor: https://training-planner.darwin-labs.org
            description: Strava-connected cycling, running and swimming tracker
            icon: mdi-run-fast
    - Platform:
        - ArgoCD:
            href: https://argocd.darwin-labs.org
            siteMonitor: https://argocd.darwin-labs.org
            description: GitOps deployment control plane
            icon: argocd.png
        - GitHub Issue Pipeline:
            href: https://gh-issue-pipeline.darwin-labs.org/healthz
            siteMonitor: https://gh-issue-pipeline.darwin-labs.org/healthz
            description: Codex issue automation webhook
            icon: github.png
        - Homepage:
            href: https://homepage.darwin-labs.org
            siteMonitor: https://homepage.darwin-labs.org
            description: Server start page and service index
            icon: homepage.png
    - Deployment:
        - GitOps Repository:
            href: https://github.com/Branchenprimus/auto-app-deploy
            siteMonitor: https://github.com/Branchenprimus/auto-app-deploy
            description: App manifests, Helm chart, platform config
            icon: github.png
        - Issue Pipeline Repository:
            href: https://github.com/Branchenprimus/gh-issue-pipeline
            siteMonitor: https://github.com/Branchenprimus/gh-issue-pipeline
            description: GitHub issue automation service
            icon: github.png
        - GitHub Actions:
            href: https://github.com/Branchenprimus/auto-app-deploy/actions
            siteMonitor: https://github.com/Branchenprimus/auto-app-deploy/actions
            description: Cloudflare Access and platform workflows
            icon: github-actions.png
        - GHCR Packages:
            href: https://github.com/orgs/Branchenprimus/packages
            siteMonitor: https://github.com/orgs/Branchenprimus/packages
            description: Container images
            icon: docker.png
    - Monitoring:
        - Grafana:
            href: https://grafana.darwin-labs.org
            description: Planned metrics and log dashboard
            icon: grafana.png
        - Loki:
            href: https://grafana.darwin-labs.org/explore
            description: Planned log exploration
            icon: loki.png
        - Cloudflare Zero Trust:
            href: https://one.dash.cloudflare.com
            siteMonitor: https://one.dash.cloudflare.com
            description: Access policies and tunnel status
            icon: cloudflare.png
  widgets.yaml: |
    - search:
        provider: duckduckgo
        target: _blank
  docker.yaml: ""
  proxmox.yaml: ""
  openapi.yaml: ""
  custom.css: ""
  custom.js: ""
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: homepage
  labels:
    app.kubernetes.io/name: homepage
rules:
  - apiGroups:
      - ""
    resources:
      - namespaces
      - nodes
      - pods
    verbs:
      - get
      - list
  - apiGroups:
      - networking.k8s.io
    resources:
      - ingresses
    verbs:
      - get
      - list
  - apiGroups:
      - metrics.k8s.io
    resources:
      - nodes
      - pods
    verbs:
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: homepage
  labels:
    app.kubernetes.io/name: homepage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: homepage
subjects:
  - kind: ServiceAccount
    name: homepage
    namespace: apps
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: apps
  labels:
    app.kubernetes.io/name: homepage
spec:
  revisionHistoryLimit: 3
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: homepage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: homepage
    spec:
      serviceAccountName: homepage
      automountServiceAccountToken: true
      containers:
        - name: homepage
          image: ghcr.io/gethomepage/homepage:latest
          imagePullPolicy: Always
          env:
            - name: MY_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: "$(MY_POD_IP):3000,homepage.darwin-labs.org"
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /api/healthcheck
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/healthcheck
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - mountPath: /app/config/bookmarks.yaml
              name: homepage-config
              subPath: bookmarks.yaml
            - mountPath: /app/config/custom.css
              name: homepage-config
              subPath: custom.css
            - mountPath: /app/config/custom.js
              name: homepage-config
              subPath: custom.js
            - mountPath: /app/config/docker.yaml
              name: homepage-config
              subPath: docker.yaml
            - mountPath: /app/config/openapi.yaml
              name: homepage-config
              subPath: openapi.yaml
            - mountPath: /app/config/proxmox.yaml
              name: homepage-config
              subPath: proxmox.yaml
            - mountPath: /app/config/kubernetes.yaml
              name: homepage-config
              subPath: kubernetes.yaml
            - mountPath: /app/config/services.yaml
              name: homepage-config
              subPath: services.yaml
            - mountPath: /app/config/settings.yaml
              name: homepage-config
              subPath: settings.yaml
            - mountPath: /app/config/widgets.yaml
              name: homepage-config
              subPath: widgets.yaml
            - mountPath: /app/config/logs
              name: logs
      volumes:
        - name: homepage-config
          configMap:
            name: homepage
        - name: logs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: homepage
  namespace: apps
  labels:
    app.kubernetes.io/name: homepage
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: homepage
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homepage
  namespace: apps
  labels:
    app.kubernetes.io/name: homepage
spec:
  rules:
    - host: homepage.darwin-labs.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: homepage
                port:
                  name: http
