name: Cloudflare Access

on:
  push:
    branches:
      - main
    paths:
      - "apps/*.yaml"
      - "platform-access/*.yaml"
      - "terraform/cloudflare-access/**"
      - ".github/workflows/cloudflare-access.yaml"
  workflow_dispatch:

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  apply:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform/cloudflare-access

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Sync app definitions
        run: |
          rm -rf terraform/cloudflare-access/apps
          rm -rf terraform/cloudflare-access/platform-apps
          mkdir -p terraform/cloudflare-access/apps
          mkdir -p terraform/cloudflare-access/platform-apps
          cp apps/*.yaml terraform/cloudflare-access/apps/
          if compgen -G "platform-access/*.yaml" > /dev/null; then
            cp platform-access/*.yaml terraform/cloudflare-access/platform-apps/
          fi
        working-directory: .

      - name: Terraform init
        run: terraform init

      - name: Terraform apply
        run: terraform apply -auto-approve
