name: Cloudflare Access

on:
  push:
    branches:
      - main
    paths:
      - "apps/*.yaml"
      - "terraform/cloudflare-access/**"
      - ".github/workflows/cloudflare-access.yaml"
  workflow_dispatch:

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  apply:
    if: vars.TF_AUTO_APPLY_CLOUDFLARE_ACCESS == 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform/cloudflare-access

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: terraform init

      - name: Terraform apply
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_allowed_idp_ids: ${{ vars.CLOUDFLARE_ALLOWED_IDP_IDS }}
        run: terraform apply -auto-approve
