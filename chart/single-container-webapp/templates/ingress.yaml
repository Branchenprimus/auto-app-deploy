apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "single-container-webapp.name" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "single-container-webapp.labels" . | nindent 4 }}
  {{- if .Values.homepage.enabled }}
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: {{ default "Apps" .Values.homepage.group | quote }}
    gethomepage.dev/name: {{ default (.Values.name | replace "-" " " | title) .Values.homepage.name | quote }}
    gethomepage.dev/description: {{ default (printf "%s deployed application" (.Values.name | replace "-" " " | title)) .Values.homepage.description | quote }}
    {{- $iconRegistry := .Files.Get "files/homepage-icons.yaml" | fromYaml }}
    gethomepage.dev/icon: {{ default "/icons/app-default.png" (get $iconRegistry .Values.name) | quote }}
    gethomepage.dev/href: {{ .Values.homepage.href | default (printf "https://%s%s" .Values.route.host .Values.route.path) | quote }}
    {{- /*
    One status dot per tile: check the app's in-cluster Service, not the public
    URL (Cloudflare Access answers that even when the app is down). A stopped
    app (replicaCount: 0) refuses the connection and shows red. "external"
    hides Homepage's second, Kubernetes pod-status dot.
    */}}
    gethomepage.dev/siteMonitor: {{ printf "http://%s.%s.svc.cluster.local%s" (include "single-container-webapp.name" .) .Values.namespace .Values.route.path | quote }}
    gethomepage.dev/external: "true"
    {{- if .Values.homepage.weight }}
    gethomepage.dev/weight: {{ .Values.homepage.weight | quote }}
    {{- end }}
  {{- end }}
spec:
  rules:
    - host: {{ .Values.route.host }}
      http:
        paths:
          - path: {{ .Values.route.path }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "single-container-webapp.name" . }}
                port:
                  name: http
